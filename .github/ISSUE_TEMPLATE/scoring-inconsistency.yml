name: Scoring inconsistency
description: Report a score that appears inconsistent with the documented methodology
title: "[Scoring]: "
labels:
  - scoring
  - needs-review
body:
  - type: markdown
    attributes:
      value: |
        Use this form when a score appears inconsistent with the documented methodology.

        Use the methodology proposal form instead when you want to change the rule itself.

  - type: input
    id: version
    attributes:
      label: Methodology version
      description: Which methodology version, release, or commit produced the result?
      placeholder: v0.2.0 or commit abc123
    validations:
      required: true

  - type: input
    id: dimension
    attributes:
      label: Scoring dimension
      placeholder: Dialogue, pacing, structure, or another area
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: Describe the script type, format, genre, or other context needed to understand the result.
      placeholder: For example, a 12-page nonlinear drama short.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Minimal shareable example
      description: Use synthetic, public-domain, or otherwise permitted material.
      placeholder: Include only the smallest example needed to demonstrate the issue.
      render: text
    validations:
      required: true

  - type: input
    id: actual_score
    attributes:
      label: Actual score
      placeholder: 42 out of 100
    validations:
      required: true

  - type: input
    id: expected_score
    attributes:
      label: Expected score or range
      placeholder: Approximately 65 to 75
    validations:
      required: true

  - type: textarea
    id: reasoning
    attributes:
      label: Why does this appear inconsistent?
      description: Reference the documented rule, definition, or comparable example.
      placeholder: Explain the mismatch between the methodology and the result.
    validations:
      required: true

  - type: textarea
    id: comparable_examples
    attributes:
      label: Comparable examples
      description: Include similar cases that received materially different results, when available.
      placeholder: Describe or link comparable evaluation cases.

  - type: dropdown
    id: scope
    attributes:
      label: How broadly might this apply?
      options:
        - One isolated example
        - A particular genre or format
        - A particular scoring dimension
        - Many or all scripts
        - Unsure
    validations:
      required: true

  - type: textarea
    id: possible_cause
    attributes:
      label: Possible cause
      description: Optional. Share any suspected rule, implementation detail, or edge case.
      placeholder: Describe any likely cause.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I checked the current methodology documentation.
          required: true
        - label: I searched existing issues for similar reports.
          required: true
        - label: I removed private and identifying information.
          required: true
        - label: I have permission to share the included material.
          required: true
